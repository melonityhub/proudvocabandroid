name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# A new push to the same branch makes older runs irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Verify ABI split APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
        id: verify-splits
        if: steps.assemble.outcome == 'success'
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release

          echo '== produced release APKs =='
          ls -lh

          expected=(
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-x86_64-release.apk
            app-universal-release.apk
          )

          missing=0
          for apk in "${expected[@]}"; do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected split APK: $apk"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'ABI split verification failed: not all expected APKs were produced.'
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2="$(ls "$sdk_root"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$aapt2" ]; then
            echo "::error::aapt2 not found in the Android SDK at $sdk_root"
            exit 1
          fi
          echo "using aapt2: $aapt2"

          declare -A version_codes=()
          declare -A native_codes=()
          for apk in "${expected[@]}"; do
            echo "== $apk =="
            badging="$("$aapt2" dump badging "$apk")"
            echo "$badging" | grep -E '^(package|sdkVersion|targetSdkVersion|native-code)' || true
            vc="$(echo "$badging" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
            echo "versionCode=$vc"
            case "$vc" in
              ''|*[!0-9]*)
                echo "::error::Could not read a numeric versionCode from $apk"
                exit 1
                ;;
            esac
            version_codes["$apk"]="$vc"
            echo "::notice::${apk}: versionCode=${vc}, size=$(du -h "$apk" | cut -f1)"

            # A per-ABI split that bundles native libraries must bundle them
            # for its own architecture only.
            case "$apk" in
              app-arm64-v8a-release.apk) want_abi='arm64-v8a' ;;
              app-armeabi-v7a-release.apk) want_abi='armeabi-v7a' ;;
              app-x86_64-release.apk) want_abi='x86_64' ;;
              *) want_abi='' ;;
            esac
            native_line="$(echo "$badging" | grep '^native-code:' || true)"
            native_codes["$apk"]="${native_line:-none}"
            if [ -n "$want_abi" ]; then
              if [ -n "$native_line" ]; then
                if ! echo "$native_line" | grep -q "'$want_abi'"; then
                  echo "::error::$apk ships native libraries for [$native_line] but should ship '$want_abi'."
                  exit 1
                fi
                echo "::notice::${apk}: $native_line"
              else
                echo "::notice::${apk}: no native libraries bundled"
              fi
            fi
          done

          # Every split APK must carry a unique versionCode, otherwise the
          # per-ABI APKs could not be told apart (e.g. on Google Play).
          unique_codes="$(printf '%s\n' "${version_codes[@]}" | sort -u | wc -l)"
          echo "distinct versionCodes across the ${#expected[@]} APKs: $unique_codes"
          echo "::notice::distinct versionCodes across the ${#expected[@]} APKs: $unique_codes"
          if [ "$unique_codes" -ne "${#expected[@]}" ]; then
            echo '::error::Every split APK must have a unique versionCode.'
            exit 1
          fi

          # The per-ABI splits must be newer than the universal APK so that
          # upgrading from the universal APK to a per-ABI APK always applies.
          universal_code="${version_codes[app-universal-release.apk]}"
          for apk in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
            split_code="${version_codes[$apk]}"
            if [ "$split_code" -le "$universal_code" ]; then
              echo "::error::$apk (versionCode=$split_code) must be newer than the universal APK (versionCode=$universal_code)."
              exit 1
            fi
          done

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo '## Release APKs (ABI splits)'
              echo ''
              echo '| APK | Size | versionCode | Native code |'
              echo '|---|---:|---:|:---|'
              for apk in "${expected[@]}"; do
                size="$(du -h "$apk" | cut -f1)"
                echo "| \`$apk\` | $size | ${version_codes[$apk]} | ${native_codes[$apk]} |"
              done
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo 'All 4 release APKs verified: 3 per-architecture + 1 universal.'

      - name: Verify the release APKs are signed with the committed release key
        run: |
          set -uo pipefail

          apk="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(ls "$sdk_root"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          echo "apksigner: ${apksigner:-<not found>}"
          [ -f "$apk" ] || { echo "::error::$apk does not exist"; exit 1; }
          [ -n "$apksigner" ] || { echo "::error::apksigner not found under $sdk_root"; exit 1; }

          raw="$( "$apksigner" verify --print-certs "$apk" 2>&1 )" || echo "(apksigner exited non-zero)"
          printf '%s\n' "$raw"
          echo "::notice::apksigner on $(basename "$apk"): $(printf '%s' "$raw" | head -c 400 | tr '\n' '~')"

          actual="$(printf '%s\n' "$raw" \
            | grep -oE 'SHA-256 digest: [0-9a-fA-F:]+' | head -n1 \
            | sed 's/.*digest: //' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "apk signer certificate: ${actual:-<none>}"

          if [ -n "${PV_KEYSTORE_FILE:-}" ]; then
            echo "::notice::Signed with the PV_KEYSTORE_* secret key (${actual:-unknown})."
            exit 0
          fi

          store_pass="$(sed -n 's/^storePassword=//p' keystore/release.properties)"
          key_alias="$(sed -n 's/^keyAlias=//p' keystore/release.properties)"
          expected="$( keytool -list -v -keystore keystore/release.keystore -storetype PKCS12 \
            -storepass "$store_pass" -alias "$key_alias" 2>&1 \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f' )"
          echo "committed key:          ${expected:-<unreadable>}"
          echo "::notice::committed release key: ${expected:-<unreadable>} / apk signed by: ${actual:-<none>}"

          if [ -z "$expected" ]; then
            echo "::error::could not read the certificate from keystore/release.keystore (alias '$key_alias')"
            exit 1
          fi
          if [ -z "$actual" ]; then
            echo "::error::could not read the signing certificate of $apk"
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::$apk is signed with $actual but the repo ships $expected — it would not install over the previous release."
            exit 1
          fi
          echo "::notice::Release APKs are signed with the committed stable key ($actual)."

      - name: Run unit tests
        id: test
        if: always()
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Lint
        id: lint
        if: always()
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --no-daemon 2>&1 | tee lint.log

      - name: Summarise lint findings
        if: always()
        run: |
          python3 - <<'PY' || true
          import collections
          import os
          import xml.etree.ElementTree as ET

          path = 'app/build/reports/lint-results-debug.xml'
          if not os.path.exists(path):
              print('no lint report produced')
              raise SystemExit

          root = ET.parse(path).getroot()
          counts = collections.Counter()
          for issue in root.iter('issue'):
              counts[(issue.get('severity'), issue.get('id'))] += 1

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as out:
                  out.write('## Lint findings\n\n')
                  out.write('| Severity | Issue | Count |\n|---|---|---:|\n')
                  for (severity, issue_id), n in sorted(counts.items(), key=lambda kv: str(kv[0])):
                      out.write(f'| {severity} | `{issue_id}` | {n} |\n')
                  out.write('\n### Lint errors\n')

          print('--- lint findings ---')
          for (severity, issue_id), n in sorted(counts.items(), key=lambda kv: str(kv[0])):
              print('%-8s %-40s x%d' % (severity, issue_id, n))

          errors = [issue for issue in root.iter('issue')
                    if issue.get('severity') in ('Error', 'Fatal')]
          if not errors:
              print('No lint errors.')
          for issue in errors[:40]:
              loc = issue.find('location')
              where = ''
              if loc is not None:
                  where = '%s:%s' % (loc.get('file', ''), loc.get('line', ''))
              issue_id = issue.get('id') or 'Lint'
              message = issue.get('message') or ''
              safe = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Lint {issue_id}::{safe}')
              print(f'{issue_id} {where} {message}')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as out:
                      out.write(f'- **{issue_id}** at `{where}`: {message}\n')
          PY

      - name: Surface Gradle diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re

          pattern = re.compile(
              r'(^e: |^w: |error:|FAILURE:|What went wrong|Unresolved reference|'
              r'Could not resolve|Lint found [0-9]+ errors)',
              re.IGNORECASE,
          )
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          count = 0
          for name in ('build.log', 'test.log', 'lint.log'):
              if not os.path.exists(name):
                  continue
              with open(name, encoding='utf-8', errors='replace') as source:
                  matches = [line.rstrip() for line in source if pattern.search(line)]
              if not matches:
                  continue
              heading = f'## {name} diagnostics'
              if summary:
                  with open(summary, 'a', encoding='utf-8') as out:
                      out.write(heading + '\n')
              print(heading)
              for line in matches[:20]:
                  safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{safe}')
                  print(f'- `{line}`')

          # Deep-dive: when a KSP failure appears, print targeted excerpts as
          # separate (small) annotations: task markers, the exception block,
          # the stack trace and the schema dir state.
          for name in ('build.log', 'test.log', 'lint.log'):
              if not os.path.exists(name):
                  continue
              lines = open(name, encoding='utf-8', errors='replace').read().splitlines()

              def emit(title, payload):
                  safe = payload.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:1400]
                  print(f'::error title={title}::{safe}')
                  print(f'### {title}')
                  print('```')
                  print(payload[:2000])
                  print('```')
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as out:
                          out.write(f'## {title}\n```\n{payload[:2000]}\n```\n')

              ksp_tasks = [f'{i}: {l.strip()}' for i, l in enumerate(lines)
                           if re.search(r'> Task :app:ksp\w*', l)]
              if ksp_tasks:
                  emit(f'{name} ksp task lines', '\n'.join(ksp_tasks))

              for i, line in enumerate(lines):
                  if 'Empty schema file' not in line and '[ksp]' not in line:
                      continue
                  emit(f'{name} around error (line {i})',
                       '\n'.join(lines[max(0, i - 15):i + 10]))
                  # the Gradle failure report with the full cause chain
                  for j, l2 in enumerate(lines):
                      if l2.startswith('* Exception') or l2.startswith('FAILURE: Build failed'):
                          emit(f'{name} failure report (line {j})',
                               '\n'.join(lines[j:j + 60]))
                          break
                  break
          PY

          echo '--- schema dir after build ---'
          ls -la app/schemas/com.proudvocab.android.core.data.AppDatabase/ 2>/dev/null || echo 'no schema dir after build'

      - name: Upload debug APKs
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK — arm64-v8a
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK — armeabi-v7a
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-release-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK — x86_64
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-release-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK — universal
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-release-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            build.log
            test.log
            lint.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
