name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# A new push to the same branch makes older runs irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and assemble the debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Run unit tests
        id: test
        if: always()
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Upload the debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: proudvocab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the build logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ci-logs
          [ -f build.log ] && cp build.log "ci-logs/build-${{ github.run_id }}-${{ github.run_attempt }}.log" || true
          [ -f test.log ] && cp test.log "ci-logs/test-${{ github.run_id }}-${{ github.run_attempt }}.log" || true
          git config user.name "Arena CI"
          git config user.email "ci@arena.ai"
          git add ci-logs
          if git diff --cached --quiet; then
            echo "no logs to publish"
            exit 0
          fi
          git commit -m "ci: publish build logs for run ${{ github.run_id }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
