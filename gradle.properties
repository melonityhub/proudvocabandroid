# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Single-module project: task parallelism buys nothing, and it lets the
# debug and release KSP tasks race to create app/schemas/.../1.json --
# Room reads the file mid-truncate and dies with "Empty schema file".
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=false
