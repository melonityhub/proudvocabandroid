name: Emulator smoke test (API 31)

# On-device gate for the "the app must open and must not crash" requirement.
#
# The JVM unit tests run on desktop java.util.regex, which is more permissive
# than the ICU-backed regex engine Android uses at runtime — 1.0.2 shipped a
# subtitle regex that the JVM accepted but a real device rejected, crashing
# the app at launch. That class of bug can only be caught on a device, so
# this workflow:
#
#   1. runs the instrumented tests (`:app:connectedDebugAndroidTest`) — they
#      exercise the subtitle parser and the launch path on a real engine;
#   2. installs the signed release APK on an Android 12 (API 31) emulator —
#      the version the original crash report came from (Poco X3 Pro);
#   3. launches the app and drives it with 400 random monkey events;
#   4. opens a generated sample video plus English and windows-1256 Persian
#      subtitles through real VIEW intents, so playback, subtitle parsing,
#      encoding detection and the word chips are all exercised;
#   5. drives another 400 monkey events through the loaded player;
#   6. fails the job if the tests failed, if the app crashed (FATAL
#      EXCEPTION for our package) or if the process is not alive at the end.
#
# NOTE: reactivecircus/android-emulator-runner executes the `script` input
# LINE BY LINE, each line as a separate `sh -c` (dash) invocation on the
# runner. Multi-line constructs (heredocs, if/for blocks, `\` continuations)
# and shell variables set on one line do NOT survive to the next line. The
# script below is therefore written as independent one-liners; shared values
# come from the workflow-level env (PKG, APK).
#
# Logs are uploaded as artifacts; on branch pushes they are also committed to
# `ci-logs/` (gitignored, force-added) so they can be inspected without the
# Actions UI.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  smoke:
    name: API 31 emulator — device tests, launch, playback, monkey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PKG: com.proudvocab.android
      APK: app/build/outputs/apk/release/app-universal-release.apk
      MEDIA_DIR: /sdcard/Android/data/com.proudvocab.android/files
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build the release APK and the device-test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Run the whole smoke suite on an API 31 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          script: |
            cd "$GITHUB_WORKSPACE"
            echo "== 1/5 instrumented device tests =="
            ./gradlew :app:connectedDebugAndroidTest --no-daemon > "$GITHUB_WORKSPACE/smoke-tests.log" 2>&1 || true
            echo "== 2/5 install the release APK =="
            adb install -r "$APK" || true
            echo "== 3/5 launch the app and hammer it with monkey =="
            adb shell am start -n $PKG/.MainActivity || true
            sleep 20
            adb shell ps -A > "$GITHUB_WORKSPACE/ps-after-launch.txt" 2>&1 || true
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER --throttle 300 400 || true
            sleep 10
            echo "== 4/5 open a sample video + subtitles through VIEW intents =="
            ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=8:size=320x240:rate=15 -f lavfi -i sine=frequency=440:duration=8 -pix_fmt yuv420p -shortest sample.mp4 || true
            printf '1\n00:00:01,000 --> 00:00:03,000\nHello world, this is a beautiful day\n\n2\n00:00:04,000 --> 00:00:06,500\nThe quick brown fox jumps over the lazy dog\n\n3\n00:00:06,800 --> 00:00:08,000\nThank you very much\n' > sample.srt
            python3 -c "open('sample-fa.srt','wb').write('1\n00:00:01,000 --> 00:00:03,000\nسلام دنیا\n\n2\n00:00:04,000 --> 00:00:06,500\nاین یک روز قشنگ است\n'.encode('cp1256'))"
            adb shell mkdir -p "$MEDIA_DIR" || true
            adb push sample.mp4 "$MEDIA_DIR/sample.mp4" || true
            adb push sample.srt "$MEDIA_DIR/sample.srt" || true
            adb push sample-fa.srt "$MEDIA_DIR/sample-fa.srt" || true
            adb shell am start -a android.intent.action.VIEW -d "file://$MEDIA_DIR/sample.mp4" -t video/mp4 -n $PKG/.MainActivity || true
            sleep 10
            adb shell am start -a android.intent.action.VIEW -d "file://$MEDIA_DIR/sample.srt" -t application/x-subrip -n $PKG/.MainActivity || true
            sleep 6
            adb shell am start -a android.intent.action.VIEW -d "file://$MEDIA_DIR/sample-fa.srt" -t application/x-subrip -n $PKG/.MainActivity || true
            sleep 6
            echo "== 5/5 monkey through the loaded player =="
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER --throttle 300 400 || true
            sleep 10
            adb shell am force-stop $PKG.debug 2>/dev/null || true
            adb shell ps -A > "$GITHUB_WORKSPACE/ps-after-monkey.txt" 2>&1 || true
            adb logcat -d > "$GITHUB_WORKSPACE/emulator-logcat.txt" 2>&1 || true
            adb shell am force-stop $PKG || true
            echo "== gate =="
            grep -q "BUILD SUCCESSFUL" "$GITHUB_WORKSPACE/smoke-tests.log" || { echo "DEVICE TESTS FAILED — see smoke-tests.log"; exit 1; }
            if grep -A1 "FATAL EXCEPTION" "$GITHUB_WORKSPACE/emulator-logcat.txt" | grep -q "$PKG"; then echo "APP CRASHED: FATAL EXCEPTION for $PKG — see emulator-logcat.txt"; exit 1; fi
            if ! grep -q " $PKG\$" "$GITHUB_WORKSPACE/ps-after-monkey.txt"; then echo "APP PROCESS NOT RUNNING AFTER THE SMOKE RUN"; exit 1; fi
            echo "SMOKE OK: device tests + launch + playback + 800 monkey events, no crash."

      - name: Summarise the captured logs
        if: always()
        run: |
          echo "== build log tail =="
          tail -25 build.log 2>/dev/null || echo "(no build.log)"
          echo "== device test log tail =="
          tail -25 smoke-tests.log 2>/dev/null || echo "(no smoke-tests.log)"
          echo "== process after launch =="
          grep -i proudvocab ps-after-launch.txt 2>/dev/null || echo "PROCESS NOT RUNNING AFTER LAUNCH"
          echo "== process after monkey =="
          grep -i proudvocab ps-after-monkey.txt 2>/dev/null || echo "PROCESS NOT RUNNING AFTER MONKEY"
          echo "== FATAL EXCEPTION blocks =="
          grep -n "FATAL EXCEPTION" emulator-logcat.txt 2>/dev/null || echo "no FATAL EXCEPTION line"
          echo "== our package's errors =="
          grep -E "^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ E " emulator-logcat.txt 2>/dev/null | grep -i proudvocab | head -30 || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-api31
          path: |
            emulator-logcat.txt
            ps-after-launch.txt
            ps-after-monkey.txt
            build.log
            smoke-tests.log
          if-no-files-found: warn

      - name: Publish logs to this branch (push events, on failure)
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          mkdir -p ci-logs
          cp emulator-logcat.txt ci-logs/emulator-logcat.txt 2>/dev/null || true
          cp ps-after-launch.txt ci-logs/ps-after-launch.txt 2>/dev/null || true
          cp ps-after-monkey.txt ci-logs/ps-after-monkey.txt 2>/dev/null || true
          cp build.log ci-logs/build.log 2>/dev/null || true
          cp smoke-tests.log ci-logs/smoke-tests.log 2>/dev/null || true
          git add -f ci-logs/
          git commit -m "ci: API 31 emulator logs (smoke test failed) [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
