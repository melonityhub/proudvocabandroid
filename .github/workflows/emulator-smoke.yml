name: Emulator smoke test (API 31)

# On-device gate for the "the app must open and must not crash" requirement.
#
# The JVM unit tests run on desktop java.util.regex, which is more permissive
# than the ICU-backed regex engine Android uses at runtime — 1.0.2 shipped a
# subtitle regex that the JVM accepted but a real device rejected, crashing
# the app at launch. That class of bug can only be caught on a device, so
# this workflow:
#
#   1. runs the instrumented tests (`:app:connectedDebugAndroidTest`) — they
#      exercise the subtitle parser and the launch path on a real engine;
#   2. installs the signed release APK on an Android 12 (API 31) emulator —
#      the version the original crash report came from (Poco X3 Pro);
#   3. launches the app and drives it with 400 random monkey events;
#   4. opens a generated sample video plus English and windows-1256 Persian
#      subtitles through real VIEW intents, so playback, subtitle parsing,
#      encoding detection and the word chips are all exercised;
#   5. drives another 400 monkey events through the loaded player;
#   6. fails the job if the app crashed (FATAL EXCEPTION for our package) or
#      if the process is not alive at the end.
#
# Logs are uploaded as artifacts; on branch pushes they are also committed to
# `ci-logs/` (gitignored, force-added) so they can be inspected without the
# Actions UI.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  smoke:
    name: API 31 emulator — device tests, launch, playback, monkey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PKG: com.proudvocab.android
      APK: app/build/outputs/apk/release/app-universal-release.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build the release APK and the device-test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Run the whole smoke suite on an API 31 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          script: |
            set -x
            cd "$GITHUB_WORKSPACE"
            FAIL=0
            MEDIA_DIR=/sdcard/Android/data/$PKG/files

            echo "== 1/5 instrumented device tests =="
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || FAIL=1

            echo "== 2/5 install the release APK =="
            adb install -r "$APK" || FAIL=1

            echo "== 3/5 launch the app and hammer it with monkey =="
            adb shell am start -n $PKG/.MainActivity || FAIL=1
            sleep 20
            adb shell ps -A > "$GITHUB_WORKSPACE/ps-after-launch.txt" 2>&1 || true
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER --throttle 300 400 || true
            sleep 10

            echo "== 4/5 open a sample video + subtitles through VIEW intents =="
            if ! command -v ffmpeg >/dev/null 2>&1; then
              echo "::error::ffmpeg is not available on the runner"
              FAIL=1
            fi
            ffmpeg -y -loglevel error \
              -f lavfi -i testsrc=duration=8:size=320x240:rate=15 \
              -f lavfi -i sine=frequency=440:duration=8 \
              -pix_fmt yuv420p -shortest sample.mp4 || FAIL=1
            cat > sample.srt <<'SRT'
            1
            00:00:01,000 --> 00:00:03,000
            Hello world, this is a beautiful day

            2
            00:00:04,000 --> 00:00:06,500
            The quick brown fox jumps over the lazy dog

            3
            00:00:06,800 --> 00:00:08,000
            Thank you very much
            SRT
            python3 - <<'PY'
            srt = ("1\n00:00:01,000 --> 00:00:03,000\nسلام دنیا\n\n"
                   "2\n00:00:04,000 --> 00:00:06,500\nاین یک روز قشنگ است\n")
            with open("sample-fa.srt", "wb") as f:
                f.write(srt.encode("cp1256"))
            PY
            adb shell mkdir -p "$MEDIA_DIR"
            adb push sample.mp4 "$MEDIA_DIR/sample.mp4" || FAIL=1
            adb push sample.srt "$MEDIA_DIR/sample.srt" || FAIL=1
            adb push sample-fa.srt "$MEDIA_DIR/sample-fa.srt" || FAIL=1
            # "Open with ProudVocab" — the same intent another app would send.
            adb shell am start -a android.intent.action.VIEW \
              -d "file://$MEDIA_DIR/sample.mp4" -t video/mp4 -n $PKG/.MainActivity || FAIL=1
            sleep 10
            adb shell am start -a android.intent.action.VIEW \
              -d "file://$MEDIA_DIR/sample.srt" -t application/x-subrip -n $PKG/.MainActivity || FAIL=1
            sleep 6
            # Re-open with the windows-1256 Persian file to exercise decoding.
            adb shell am start -a android.intent.action.VIEW \
              -d "file://$MEDIA_DIR/sample-fa.srt" -t application/x-subrip -n $PKG/.MainActivity || FAIL=1
            sleep 6

            echo "== 5/5 monkey through the loaded player =="
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER --throttle 300 400 || true
            sleep 10
            adb shell am force-stop $PKG.debug 2>/dev/null || true
            adb shell ps -A > "$GITHUB_WORKSPACE/ps-after-monkey.txt" 2>&1 || true
            adb logcat -d > "$GITHUB_WORKSPACE/emulator-logcat.txt" 2>&1 || true
            adb shell am force-stop $PKG || true

            echo "== gate =="
            if grep -A1 "FATAL EXCEPTION" "$GITHUB_WORKSPACE/emulator-logcat.txt" | grep -q "$PKG"; then
              echo "APP CRASHED: FATAL EXCEPTION for $PKG — see emulator-logcat.txt"
              FAIL=1
            fi
            if ! grep -q " $PKG\$" "$GITHUB_WORKSPACE/ps-after-monkey.txt"; then
              echo "APP PROCESS NOT RUNNING AFTER THE SMOKE RUN"
              FAIL=1
            fi
            if [ "$FAIL" -ne 0 ]; then
              echo "::error::Emulator smoke test FAILED"
              exit 1
            fi
            echo "SMOKE OK: device tests + launch + playback + 800 monkey events, no crash."

      - name: Summarise the captured log
        if: always()
        run: |
          echo "== build log tail =="
          tail -40 build.log 2>/dev/null || echo "(no build.log)"
          echo "== smoke log tail =="
          tail -40 smoke.log 2>/dev/null || echo "(no smoke.log)"
          echo "== process after launch =="
          grep -i proudvocab ps-after-launch.txt || echo "PROCESS NOT RUNNING AFTER LAUNCH"
          echo "== process after monkey =="
          grep -i proudvocab ps-after-monkey.txt || echo "PROCESS NOT RUNNING AFTER MONKEY"
          echo "== FATAL EXCEPTION blocks =="
          grep -n "FATAL EXCEPTION" emulator-logcat.txt || echo "no FATAL EXCEPTION line"
          echo "== our package's errors =="
          grep -E "^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ E " emulator-logcat.txt \
            | grep -i proudvocab | head -30 || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-api31
          path: |
            emulator-logcat.txt
            ps-after-launch.txt
            ps-after-monkey.txt
            build.log
            smoke.log
          if-no-files-found: warn

      - name: Publish logs to this branch (push events, on failure)
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          mkdir -p ci-logs
          cp emulator-logcat.txt ci-logs/emulator-logcat.txt 2>/dev/null || true
          cp ps-after-launch.txt ci-logs/ps-after-launch.txt 2>/dev/null || true
          cp ps-after-monkey.txt ci-logs/ps-after-monkey.txt 2>/dev/null || true
          cp build.log ci-logs/build.log 2>/dev/null || true
          cp smoke.log ci-logs/smoke.log 2>/dev/null || true
          git add -f ci-logs/
          git commit -m "ci: API 31 emulator logs (smoke test failed) [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
