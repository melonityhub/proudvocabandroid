name: Device tests (Android 12)

# Runs on a real Android 12 (API 31) emulator for BOTH CPU families the user's
# phones use, in English and in Persian. A failure anywhere fails the run:
# there are no `|| true` escape hatches around the app checks.
#
# The APKs are built ONCE on x86 (the arm64 runner cannot run AGP's aapt2),
# then both device jobs install those exact files. So the APK that passes here
# is byte-identical to the one the release workflow publishes.
on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs for device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build release, debug and instrumentation-test APKs
        run: |
          mkdir -p ci-artifacts/build
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --stacktrace > ci-artifacts/build/build.log 2>&1

      # The raw job log is not always downloadable, so publish the error lines
      # as annotations on the failed step.
      - name: Report build errors
        if: failure()
        run: |
          f=ci-artifacts/build/build.log
          [ -f "$f" ] || exit 0
          echo "== $f ($(wc -l < "$f") lines)"
          {
            grep -n -E "^e: |What went wrong|Caused by" -A3 "$f" | head -120
            echo "----- tail -----"
            tail -n 120 "$f"
          } | while IFS= read -r line; do
            printf '::notice title=build.log::%s\n' "$(printf '%s' "$line" | cut -c1-700)"
          done

      - name: Collect APKs
        run: |
          set -euo pipefail
          find app/build/outputs -name "*.apk" | sort
          mkdir -p apks
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk apks/
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk apks/
          cp app/build/outputs/apk/release/app-x86_64-release.apk apks/
          cp app/build/outputs/apk/release/app-universal-release.apk apks/
          # The debug variant is split per ABI too; the universal debug APK
          # carries every ABI, so it is the one the emulators install.
          cp app/build/outputs/apk/debug/app-universal-debug.apk apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
          ls -l apks

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/
          retention-days: 14

  device:
    name: API 31 ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64 · English UI
            runner: ubuntu-latest
            arch: x86_64
            abi: x86_64
            locale: ""
          - label: arm64-v8a · Persian UI
            runner: ubuntu-24.04-arm
            arch: arm64-v8a
            abi: arm64-v8a
            locale: fa
    env:
      ABI: ${{ matrix.abi }}
      PV_LOCALE: ${{ matrix.locale }}
      PREVIOUS_RELEASE: v1.0.3
      APK_DIR: apks
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is missing on this runner; the emulator will run without hardware acceleration"
          fi

      # The arm64 runner has no Android SDK preinstalled. Reuse the runner's SDK
      # when it exists; otherwise install the command-line tools and the
      # platform-tools the emulator runner needs.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Using the runner's SDK at $ANDROID_HOME"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SM" --sdk_root="$SDK" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Make sure ffmpeg is available
        run: |
          command -v ffmpeg || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -n1

      - name: Run device checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          disk-size: 6G
          heap-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-smoke.sh

      - name: Upload device logs, screenshots and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-logs-${{ matrix.abi }}
          path: ci-artifacts/${{ matrix.abi }}/
          if-no-files-found: warn
          retention-days: 14
