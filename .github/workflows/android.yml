name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# A new push to the same branch makes older runs irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Run unit tests
        id: test
        if: always()
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Lint
        id: lint
        if: always()
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --no-daemon 2>&1 | tee lint.log

      - name: Summarise lint findings
        if: always()
        run: |
          python3 - <<'PY' || true
          import collections
          import os
          import xml.etree.ElementTree as ET

          path = 'app/build/reports/lint-results-debug.xml'
          if not os.path.exists(path):
              print('no lint report produced')
              raise SystemExit

          root = ET.parse(path).getroot()
          counts = collections.Counter()
          for issue in root.iter('issue'):
              counts[(issue.get('severity'), issue.get('id'))] += 1

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as out:
                  out.write('## Lint findings\n\n')
                  out.write('| Severity | Issue | Count |\n|---|---|---:|\n')
                  for (severity, issue_id), n in sorted(counts.items(), key=lambda kv: str(kv[0])):
                      out.write(f'| {severity} | `{issue_id}` | {n} |\n')
                  out.write('\n### Lint errors\n')

          print('--- lint findings ---')
          for (severity, issue_id), n in sorted(counts.items(), key=lambda kv: str(kv[0])):
              print('%-8s %-40s x%d' % (severity, issue_id, n))

          errors = [issue for issue in root.iter('issue')
                    if issue.get('severity') in ('Error', 'Fatal')]
          if not errors:
              print('No lint errors.')
          for issue in errors[:40]:
              loc = issue.find('location')
              where = ''
              if loc is not None:
                  where = '%s:%s' % (loc.get('file', ''), loc.get('line', ''))
              issue_id = issue.get('id') or 'Lint'
              message = issue.get('message') or ''
              safe = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Lint {issue_id}::{safe}')
              print(f'{issue_id} {where} {message}')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as out:
                      out.write(f'- **{issue_id}** at `{where}`: {message}\n')
          PY

      - name: Surface Gradle diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re

          pattern = re.compile(
              r'(^e: |^w: |error:|FAILURE:|What went wrong|Unresolved reference|'
              r'Could not resolve|Lint found [0-9]+ errors)',
              re.IGNORECASE,
          )
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          count = 0
          for name in ('build.log', 'test.log', 'lint.log'):
              if not os.path.exists(name):
                  continue
              with open(name, encoding='utf-8', errors='replace') as source:
                  matches = [line.rstrip() for line in source if pattern.search(line)]
              if not matches:
                  continue
              heading = f'## {name} diagnostics'
              if summary:
                  with open(summary, 'a', encoding='utf-8') as out:
                      out.write(heading + '\n')
              print(heading)
              for line in matches[:20]:
                  safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{safe}')
                  print(f'- `{line}`')
                  count += 1
                  if count >= 30:
                      break
              if count >= 30:
                  break
          PY

      - name: Upload debug and release APKs
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            build.log
            test.log
            lint.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
