name: Device tests (Android 12)

# Runs on a real Android 12 (API 31) emulator for BOTH CPU families the user's
# phones use, in English and in Persian. A failure anywhere fails the run:
# there are no `|| true` escape hatches around the app checks.
on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    name: API 31 ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64 · English UI
            runner: ubuntu-latest
            arch: x86_64
            abi: x86_64
            locale: ""
          - label: arm64-v8a · Persian UI
            runner: ubuntu-24.04-arm
            arch: arm64-v8a
            abi: arm64-v8a
            locale: fa
    env:
      ABI: ${{ matrix.abi }}
      PV_LOCALE: ${{ matrix.locale }}
      PREVIOUS_RELEASE: v1.0.3
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is missing on this runner; the emulator will run without hardware acceleration"
          fi

      - name: Build release APKs
        run: |
          mkdir -p ci-artifacts/${{ matrix.abi }}
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > ci-artifacts/${{ matrix.abi }}/build-release.log 2>&1

      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace > ci-artifacts/${{ matrix.abi }}/build-androidtest.log 2>&1

      # The raw job log is not always downloadable, so surface the actual
      # compiler/Gradle error lines as annotations on the failed step.
      - name: Report build errors
        if: failure()
        run: |
          for f in ci-artifacts/${{ matrix.abi }}/build-*.log; do
            [ -f "$f" ] || continue
            echo "== $f"
            grep -E "^e: |What went wrong|Execution failed|Could not |> |FAILURE" -A3 "$f" | head -60 | while IFS= read -r line; do
              echo "::error title=$(basename "$f")::$(printf '%s' "$line" | cut -c1-900)"
            done
          done

      - name: Run device checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          disk-size: 6G
          heap-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-smoke.sh

      - name: Upload device logs, screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-logs-${{ matrix.abi }}
          path: ci-artifacts/${{ matrix.abi }}/
          if-no-files-found: warn
          retention-days: 14
